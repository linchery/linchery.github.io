<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3D Photo Gallery</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Amiri&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap");

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f5f0;
      color: #333;
      font-family: "Helvetica Neue", "Noto Sans JP", sans-serif;
    }

    body {
      position: relative;
      touch-action: none;
    }

    ul,
    li {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #c {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 7px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.82);
      color: #333;
      font-size: 13px;
      line-height: 1.5;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(8px);
    }

    #status {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 9px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.82);
      color: #555;
      font-size: 12px;
      pointer-events: none;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.07);
      border: 1px solid rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(8px);
    }

    .hamburger-menu {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .hamburger-menu > * {
      pointer-events: auto;
    }

    .menu-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 22;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.35s ease, transform 0.35s ease;
    }

    .menu-btn span,
    .menu-btn span::before,
    .menu-btn span::after {
      content: "";
      display: block;
      width: 28px;
      height: 2px;
      border-radius: 999px;
      background-color: rgb(95, 95, 95);
      position: absolute;
      transition: transform 0.4s ease, opacity 0.3s ease, background-color 0.35s ease, top 0.4s ease, bottom 0.4s ease;
    }

    .menu-btn span::before {
      bottom: 8px;
    }

    .menu-btn span::after {
      top: 8px;
    }

    #menu-btn-check {
      display: none;
    }

    #menu-btn-check:checked ~ .menu-btn {
      background-color: rgba(255, 255, 255, 0.08);
    }

    #menu-btn-check:checked ~ .menu-btn span {
      background-color: rgba(255, 255, 255, 0);
    }

    #menu-btn-check:checked ~ .menu-btn span::before {
      bottom: 0;
      background-color: rgb(95, 95, 95);
      transform: rotate(32deg) scaleX(0.95);
    }

    #menu-btn-check:checked ~ .menu-btn span::after {
      top: 0;
      background-color: rgb(95, 95, 95);
      transform: rotate(-32deg) scaleX(0.95);
    }

    .menu-content {
      position: absolute;
      inset: 0;
      z-index: 21;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(180deg, rgba(235, 245, 250, 0.97) 0%, rgba(227, 240, 247, 0.95) 52%, rgba(220, 235, 244, 0.96) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.45s ease, visibility 0.45s ease;
      padding: 3rem;
    }

    #menu-btn-check:checked ~ .menu-content {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-panel {
      width: min(980px, 100%);
      min-height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 3rem;
    }

    .menu-heading {
      margin: 0 0 2.25rem;
      font-family: "Amiri", serif;
      font-size: clamp(2.5rem, 4vw, 4.2rem);
      line-height: 1;
      letter-spacing: 0.16em;
      color: rgba(118, 142, 156, 0.28);
      text-align: center;
    }

    .links {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 2.2rem;
      row-gap: 1.8rem;
      align-items: end;
    }

    .links li {
      border-bottom: 1px solid rgba(112, 100, 90, 0.18);
      min-width: 0;
    }

    .links li a {
      display: block;
      width: 100%;
      padding: 0 0 0.7rem;
      color: #2f2b28;
      font-family: "Noto Serif JP", serif;
      text-decoration: none;
      letter-spacing: 0.12em;
      font-size: clamp(1.05rem, 1.3vw, 1.4rem);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.45s ease, transform 0.45s ease, color 0.25s ease;
    }

    #menu-btn-check:checked ~ .menu-content .links a {
      opacity: 1;
      transform: translateY(0);
    }

    #menu-btn-check:checked ~ .menu-content .links li:nth-child(1) a { transition-delay: 0.05s; }
    #menu-btn-check:checked ~ .menu-content .links li:nth-child(2) a { transition-delay: 0.1s; }
    #menu-btn-check:checked ~ .menu-content .links li:nth-child(3) a { transition-delay: 0.15s; }
    #menu-btn-check:checked ~ .menu-content .links li:nth-child(4) a { transition-delay: 0.2s; }

    .menu-footer {
      padding-top: 0;
    }

    .share_icon.menu-share {
      margin-top: 0;
      text-align: center;
      padding-left: 0;
    }

    .menu-share li {
      width: 1.6em;
      display: inline-block;
      vertical-align: top;
      margin: 0 2rem 0 0;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .menu-share li:last-child {
      margin-right: 0;
    }

    .menu-share li img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 1;
    }

    .menu-share li a {
      display: block;
      width: 100%;
      padding: 0;
      opacity: 1;
      transform: none;
    }

    #menu-btn-check:checked ~ .menu-content .menu-share li {
      opacity: 1;
      transform: translateY(0);
    }

    #menu-btn-check:checked ~ .menu-content .menu-share li:nth-child(1) { transition-delay: 0.24s; }
    #menu-btn-check:checked ~ .menu-content .menu-share li:nth-child(2) { transition-delay: 0.28s; }
    #menu-btn-check:checked ~ .menu-content .menu-share li:nth-child(3) { transition-delay: 0.32s; }
    #menu-btn-check:checked ~ .menu-content .menu-share li:nth-child(4) { transition-delay: 0.36s; }
    #menu-btn-check:checked ~ .menu-content .menu-share li:nth-child(5) { transition-delay: 0.4s; }
    
    .menu-content ul li {
      list-style: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      padding: 24px;
    }

    #overlay.is-open {
      display: flex;
    }

    .overlay-backdrop {
      position: absolute;
      inset: 0;
    }

    .overlay-panel {
      position: relative;
      z-index: 1;
      width: min(640px, 92vw);
      max-height: 92vh;
      overflow: auto;
      border-radius: 0;
      background: #fff;
      padding: 10px 10px 8px;
      box-shadow: none;
    }

    .overlay-image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay-image {
      width: 100%;
      max-width: 100%;
      max-height: 72vh;
      height: auto;
      display: block;
      border-radius: 0;
      box-shadow: none;
      background: #f3f3f3;
    }

    .overlay-title {
      display: none;
    }

    .overlay-description {
      display: none;
    }

    .overlay-meta {
      margin-top: 14px;
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .overlay-meta-line {
      color: #222;
      font-family: "Noto Sans JP", sans-serif;
      font-size: 17px;
      line-height: 1.5;
      text-align: center;
    }

    .overlay-meta-line strong {
      color: #000;
      font-weight: 700;
      margin-right: 0.25em;
    }

    .overlay-close {
      margin-top: 14px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 13px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 767px) {
      #hud {
        top: 12px;
        width: calc(100vw - 110px);
        white-space: normal;
      }

      .menu-btn {
        top: 12px;
        right: 12px;
        height: 58px;
        width: 58px;
      }

      .menu-content {
        padding: 3.75rem 1.5rem 2rem;
      }

      .menu-panel {
        gap: 2.25rem;
      }

      .menu-heading {
        margin-bottom: 1.75rem;
        font-size: 2.4rem;
      }

      .links {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 1.25rem;
        row-gap: 1.25rem;
      }

      .links li a {
        font-size: 1.1rem;
        letter-spacing: 0.12em;
      }

      #status {
        left: 12px;
        bottom: 12px;
      }

      .overlay-panel {
        width: 100%;
        max-height: 94vh;
        padding: 8px 8px 6px;
      }

      .overlay-meta-line {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div id="hud">WASD / 矢印キー で移動 ｜ マウスドラッグ で視点回転 ｜ 写真をクリックで詳細</div>
  <div id="status">Initializing gallery...</div>

  <div class="hamburger-menu">
    <input type="checkbox" id="menu-btn-check" />
    <label for="menu-btn-check" class="menu-btn"><span></span></label>
    <div class="menu-content">
      <div class="menu-panel">
        <div class="menu-main">
          <h2 class="menu-heading">MENU</h2>
          <ul class="links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="research.html">RESEARCH</a></li>
            <li><a href="publication.html">PUBLICATION</a></li>
            <li><a href="special.html">SPECIAL</a></li>
            <li><a href="gallery.html" class="is-current">GALLERY</a></li>
          </ul>
        </div>
        <div class="menu-footer">
          <ul class="share_icon menu-share">
            <li><a href="https://x.com/linda_uclab" target="_blank" rel="noreferrer" aria-label="X"><img src="./assets/img/icon_X.svg" alt="X" /></a></li>
            <li><a href="https://www.instagram.com/linchery" target="_blank" rel="noreferrer" aria-label="Instagram"><img src="./assets/img/icon_instagram.svg" alt="Instagram" /></a></li>
            <li><a href="https://m.facebook.com/linchery.nh" target="_blank" rel="noreferrer" aria-label="Facebook"><img src="./assets/img/icon_facebook.svg" alt="Facebook" /></a></li>
            <li><a href="https://youtube.com/@linchery" target="_blank" rel="noreferrer" aria-label="YouTube"><img src="./assets/img/icon_youtube.svg" alt="YouTube" /></a></li>
            <li><a href="https://github.com/linchery/" target="_blank" rel="noreferrer" aria-label="GitHub"><img src="./assets/img/icon_github.svg" alt="GitHub" /></a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <canvas id="c"></canvas>

  <div id="overlay" aria-hidden="true">
    <div class="overlay-backdrop" data-close-overlay></div>
    <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
      <div class="overlay-image-wrap">
        <img class="overlay-image" id="overlayImage" alt="" />
      </div>
      <div class="overlay-title" id="overlayTitle"></div>
      <p class="overlay-description" id="overlayDescription"></p>
      <div class="overlay-meta">
        <div class="overlay-meta-line" id="overlayCamera"></div>
        <div class="overlay-meta-line" id="overlayDate"></div>
        <div class="overlay-meta-line" id="overlayLocation"></div>
      </div>
      <button class="overlay-close" id="overlayClose" type="button">× 閉じる</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // file:// でもHTML自体は開けますが、画像読み込みはブラウザ制限で失敗することがあります。
    // 写真を確認するときは Live Server などの簡易ローカルサーバー経由で開くのがおすすめです。

    // ============================================================
    //  USER SETTINGS — ここだけ編集すれば写真を差し替えられます
    // ============================================================
    const PHOTOS = [
      {
        src: "",
        title: "夕暮れの港",
        description: "説明文をここに書きます。",
        camera: "Canon EOS R5",
        date: "2026-03-18",
        location: "Kobe Harbor, Japan",
        color: "#e8641a",
        accent: "#f5a842",
      },
      {
        src: "",
        title: "静かな回廊",
        description: "白い回廊の奥行きと静けさを想定したダミー作品です。",
        camera: "FUJIFILM X-T5",
        date: "2026-02-02",
        location: "Nagoya, Japan",
        color: "#2c5f8a",
        accent: "#9fcde8",
      },
      {
        src: "",
        title: "青の正午",
        description: "昼の光を切り取ったイメージのダミー作品です。",
        camera: "Leica Q3",
        date: "2026-01-21",
        location: "Osaka, Japan",
        color: "#e87ca0",
        accent: "#f5d0de",
      },
    ];

    const ROOM_W = 24;
    const ROOM_H = 5;
    const ROOM_D = 32;

    const WALL_PLACEMENTS = [
      { wx: -6, wz: -14.8, wy: 2.2, angle: 0 },
      { wx: 0, wz: -14.8, wy: 2.2, angle: 0 },
      { wx: 6, wz: -14.8, wy: 2.2, angle: 0 },
    ];

    // ============================================================
    //  Scene / Renderer
    // ============================================================
    const canvas = document.getElementById("c");
    const statusEl = document.getElementById("status");
    const overlayEl = document.getElementById("overlay");
    const overlayImageEl = document.getElementById("overlayImage");
    const overlayTitleEl = document.getElementById("overlayTitle");
    const overlayDescriptionEl = document.getElementById("overlayDescription");
    const overlayCameraEl = document.getElementById("overlayCamera");
    const overlayDateEl = document.getElementById("overlayDate");
    const overlayLocationEl = document.getElementById("overlayLocation");
    const overlayCloseEl = document.getElementById("overlayClose");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1008);
    scene.fog = new THREE.Fog(0x1a1008, 20, 60);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.7, ROOM_D / 2 - 2);
    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const clock = new THREE.Clock();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const keys = Object.create(null);
    const photoMeshes = [];

    let yaw = 0;
    let pitch = 0;
    let isDragging = false;
    let dragMoved = false;
    let pointerId = null;
    let lastX = 0;
    let lastY = 0;

    // ============================================================
    //  Textures
    // ============================================================
    function createFloorTexture() {
      const canvasTex = document.createElement("canvas");
      canvasTex.width = 128;
      canvasTex.height = 128;
      const ctx = canvasTex.getContext("2d");

      ctx.fillStyle = "#2a1f10";
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = "#3a2d1a";
      ctx.lineWidth = 2;

      for (let i = 0; i <= 128; i += 16) {
        ctx.beginPath();
        ctx.moveTo(i + 0.5, 0);
        ctx.lineTo(i + 0.5, 128);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i + 0.5);
        ctx.lineTo(128, i + 0.5);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvasTex);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(ROOM_W / 2, ROOM_D / 2);
      texture.encoding = THREE.sRGBEncoding;
      return texture;
    }

    function createWallTexture() {
      const c = document.createElement("canvas");
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#1e1810";
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = "#251e14";
      for (let row = 0; row < 8; row += 1) {
        const offset = row % 2 === 0 ? 0 : 32;
        for (let col = 0; col < 4; col += 1) {
          ctx.fillRect(col * 64 + offset + 1, row * 16 + 1, 62, 14);
        }
      }
      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(6, 2);
      texture.encoding = THREE.sRGBEncoding;
      return texture;
    }

    function createBenchTexture() {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#6a4a20";
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 22) {
        ctx.fillStyle = y % 44 === 0 ? "rgba(255,255,255,0.06)" : "rgba(34,18,8,0.18)";
        ctx.fillRect(0, y, 256, 10);
      }
      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1.5, 1.5);
      texture.encoding = THREE.sRGBEncoding;
      return texture;
    }

    function createGeneratedArtworkTexture(photo, index) {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 192;
      const ctx = c.getContext("2d");
      const color = photo.color || `hsl(${(index * 30) % 360}, 60%, 45%)`;
      const accent = photo.accent || `hsl(${(index * 30 + 40) % 360}, 75%, 72%)`;
      const gradient = ctx.createLinearGradient(0, 0, c.width, c.height);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, accent);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.globalAlpha = 0.18;
      for (let i = 0; i < 20; i += 1) {
        ctx.fillStyle = i % 2 === 0 ? accent : color;
        ctx.beginPath();
        ctx.arc(
          Math.random() * c.width,
          Math.random() * c.height,
          Math.random() * 28 + 8,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = "rgba(255,255,255,0.86)";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(String(photo.title || "Untitled").slice(0, 22), c.width / 2, c.height - 14);
      const texture = new THREE.CanvasTexture(c);
      texture.encoding = THREE.sRGBEncoding;
      return {
        texture,
        portrait: false,
        src: c.toDataURL("image/png"),
      };
    }

    function loadArtworkTexture(photo, index) {
      if (!photo.src) {
        return Promise.resolve(createGeneratedArtworkTexture(photo, index));
      }
      return new Promise((resolve) => {
        const loader = new THREE.TextureLoader();
        loader.load(
          photo.src,
          (texture) => {
            const image = texture.image;
            texture.encoding = THREE.sRGBEncoding;
            resolve({
              texture,
              portrait: image && image.naturalHeight > image.naturalWidth,
              src: photo.src,
            });
          },
          undefined,
          () => resolve(createGeneratedArtworkTexture(photo, index))
        );
      });
    }

    // ============================================================
    //  Room Geometry
    // ============================================================
    const dividerBoxes = [
      { x: -4, y: ROOM_H / 2, z: 0, w: 0.2, h: ROOM_H, d: 8 },
      { x: 4, y: ROOM_H / 2, z: 0, w: 0.2, h: ROOM_H, d: 8 },
    ];

    const dividerBounds = dividerBoxes.map((wall) => ({
      minX: wall.x - wall.w / 2 - 0.8,
      maxX: wall.x + wall.w / 2 + 0.8,
      minZ: wall.z - wall.d / 2 - 0.8,
      maxZ: wall.z + wall.d / 2 + 0.8,
    }));

    function buildRoom() {
      const floorTexture = createFloorTexture();
      const wallTexture = createWallTexture();
      const wallMaterial = new THREE.MeshStandardMaterial({
        color: 0x1f1811,
        map: wallTexture,
        roughness: 0.92,
        metalness: 0.02,
      });

      const ceilingMaterial = new THREE.MeshStandardMaterial({
        color: 0x2a1f10,
        map: floorTexture,
        roughness: 0.75,
        metalness: 0.03,
      });

      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(ROOM_W, 0.1, ROOM_D),
        new THREE.MeshStandardMaterial({
          color: 0x2a1f10,
          map: floorTexture,
          roughness: 0.75,
          metalness: 0.03,
        })
      );
      floor.position.y = -0.05;
      floor.receiveShadow = true;
      scene.add(floor);

      const ceiling = new THREE.Mesh(
        new THREE.BoxGeometry(ROOM_W, 0.1, ROOM_D),
        ceilingMaterial
      );
      ceiling.position.y = ROOM_H;
      scene.add(ceiling);

      const outerWalls = [
        { x: 0, y: ROOM_H / 2, z: -ROOM_D / 2, w: ROOM_W, h: ROOM_H, d: 0.2 },
        { x: 0, y: ROOM_H / 2, z: ROOM_D / 2, w: ROOM_W, h: ROOM_H, d: 0.2 },
        { x: -ROOM_W / 2, y: ROOM_H / 2, z: 0, w: 0.2, h: ROOM_H, d: ROOM_D },
        { x: ROOM_W / 2, y: ROOM_H / 2, z: 0, w: 0.2, h: ROOM_H, d: ROOM_D },
      ];

      outerWalls.concat(dividerBoxes).forEach((wall) => {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(wall.w, wall.h, wall.d),
          wallMaterial
        );
        mesh.position.set(wall.x, wall.y, wall.z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      });

      const baseboardMaterial = new THREE.MeshStandardMaterial({
        color: 0x8a6a30,
        roughness: 0.7,
        metalness: 0.02,
      });

      const baseboards = [
        { x: 0, y: 0.8, z: -ROOM_D / 2 + 0.1, w: ROOM_W, h: 0.15, d: 0.15 },
        { x: 0, y: 0.8, z: ROOM_D / 2 - 0.1, w: ROOM_W, h: 0.15, d: 0.15 },
      ];

      baseboards.forEach((board) => {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(board.w, board.h, board.d),
          baseboardMaterial
        );
        mesh.position.set(board.x, board.y, board.z);
        mesh.castShadow = true;
        scene.add(mesh);
      });

    }

    // ============================================================
    //  Lighting
    // ============================================================
    function addLights() {
      scene.add(new THREE.AmbientLight(0x3d2b10, 1.2));

      [
        [-6, ROOM_D / 2 - 4],
        [0, ROOM_D / 2 - 4],
        [6, ROOM_D / 2 - 4],
        [-6, -4],
        [0, -4],
        [6, -4],
        [-6, -ROOM_D / 2 + 4],
        [0, -ROOM_D / 2 + 4],
        [6, -ROOM_D / 2 + 4],
      ].forEach(([x, z]) => {
        const spot = new THREE.SpotLight(0xfffde0, 1.2, 20, Math.PI / 5, 0.4);
        spot.position.set(x, ROOM_H - 0.2, z);
        spot.target.position.set(x, 0, z);
        spot.castShadow = true;
        scene.add(spot);
        scene.add(spot.target);

        const fixture = new THREE.Mesh(
          new THREE.BoxGeometry(0.3, 0.15, 0.3),
          new THREE.MeshBasicMaterial({ color: 0xfffde0 })
        );
        fixture.position.set(x, ROOM_H - 0.1, z);
        scene.add(fixture);
      });
    }

    // ============================================================
    //  Photo Frame Placement
    // ============================================================
    function getFrameSize(isPortrait) {
      return isPortrait
        ? { fw: 1.5, fh: 2.2 }
        : { fw: 2.2, fh: 1.65 };
    }

    function createArtwork(photo, placement, textureInfo, index) {
      const { fw, fh } = getFrameSize(textureInfo.portrait);
      const group = new THREE.Group();

      const shadowPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(fw + 0.5, fh + 0.5),
        new THREE.MeshBasicMaterial({
          color: 0x000000,
          opacity: 0.06,
          transparent: true,
          depthWrite: false,
        })
      );
      shadowPlane.position.set(0, 0, -0.01);
      group.add(shadowPlane);

      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(fw + 0.22, fh + 0.22, 0.06),
        new THREE.MeshStandardMaterial({
          color: 0xc0a060,
          roughness: 0.48,
          metalness: 0.16,
        })
      );
      frame.castShadow = true;
      frame.receiveShadow = true;
      group.add(frame);

      const photoPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(fw, fh),
        new THREE.MeshLambertMaterial({ map: textureInfo.texture })
      );
      photoPlane.position.z = 0.031;
      group.add(photoPlane);

      const hitArea = new THREE.Mesh(
        new THREE.PlaneGeometry(fw + 0.22, fh + 0.22),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 })
      );
      hitArea.position.z = 0.07;
      hitArea.userData.photoData = {
        src: textureInfo.src,
        title: photo.title,
        description: photo.description || "",
        camera: photo.camera || "",
        date: photo.date || "",
        location: photo.location || "",
      };
      group.add(hitArea);
      photoMeshes.push(hitArea);

      const labelCanvas = document.createElement("canvas");
      labelCanvas.width = 420;
      labelCanvas.height = 90;
      const labelCtx = labelCanvas.getContext("2d");
      labelCtx.fillStyle = "#f4f1ea";
      labelCtx.fillRect(0, 0, labelCanvas.width, labelCanvas.height);
      labelCtx.fillStyle = "#49433d";
      labelCtx.font = "26px Georgia";
      labelCtx.textAlign = "center";
      labelCtx.fillText(photo.title || `Artwork ${index + 1}`, labelCanvas.width / 2, 38);
      labelCtx.fillStyle = "#7a746d";
      labelCtx.font = "16px sans-serif";
      labelCtx.fillText("Click for detail", labelCanvas.width / 2, 65);

      const label = new THREE.Mesh(
        new THREE.PlaneGeometry(1.7, 0.36),
        new THREE.MeshStandardMaterial({
          map: new THREE.CanvasTexture(labelCanvas),
          roughness: 0.9,
          metalness: 0.02,
        })
      );
      label.position.set(0, -fh / 2 - 0.36, 0.04);
      group.add(label);

      group.position.set(placement.wx, placement.wy, placement.wz);
      group.rotation.y = placement.angle;
      scene.add(group);

      const spot = new THREE.SpotLight(0xfff8ee, 2.0, 10, Math.PI / 7, 0.5);
      spot.position.set(placement.wx, ROOM_H - 0.15, placement.wz);
      spot.target.position.set(placement.wx, placement.wy, placement.wz);
      spot.castShadow = true;
      spot.shadow.mapSize.width = 1024;
      spot.shadow.mapSize.height = 1024;
      spot.shadow.bias = -0.00012;
      scene.add(spot);
      scene.add(spot.target);
    }

    async function buildArtworks() {
      const count = Math.min(PHOTOS.length, WALL_PLACEMENTS.length);
      for (let i = 0; i < count; i += 1) {
        const textureInfo = await loadArtworkTexture(PHOTOS[i], i);
        createArtwork(PHOTOS[i], WALL_PLACEMENTS[i], textureInfo, i);
      }
      statusEl.textContent = `${count} artworks loaded`;
    }

    // ============================================================
    //  Camera Controls
    // ============================================================
    function clampPitch(value) {
      return THREE.MathUtils.clamp(value, -Math.PI * 0.45, Math.PI * 0.35);
    }

    function applyCameraRotation() {
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
      camera.rotation.z = 0;
    }

    function clampPosition(nextX, nextZ) {
      let x = THREE.MathUtils.clamp(nextX, -ROOM_W / 2 + 0.8, ROOM_W / 2 - 0.8);
      let z = THREE.MathUtils.clamp(nextZ, -ROOM_D / 2 + 0.8, ROOM_D / 2 - 0.8);

      dividerBounds.forEach((bound) => {
        if (x > bound.minX && x < bound.maxX && z > bound.minZ && z < bound.maxZ) {
          const distances = [
            { axis: "x", value: Math.abs(x - bound.minX), target: bound.minX },
            { axis: "x", value: Math.abs(x - bound.maxX), target: bound.maxX },
            { axis: "z", value: Math.abs(z - bound.minZ), target: bound.minZ },
            { axis: "z", value: Math.abs(z - bound.maxZ), target: bound.maxZ },
          ].sort((a, b) => a.value - b.value);

          if (distances[0].axis === "x") {
            x = distances[0].target;
          } else {
            z = distances[0].target;
          }
        }
      });

      return { x, z };
    }

    function updateMovement() {
      const moveForward = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
      const moveStrafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
      if (!moveForward && !moveStrafe) {
        return;
      }

      const speed = 0.08;
      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const move = new THREE.Vector3();
      move.addScaledVector(forward, moveForward);
      move.addScaledVector(right, moveStrafe);
      move.normalize().multiplyScalar(speed);

      const next = clampPosition(camera.position.x + move.x, camera.position.z + move.z);
      camera.position.x = next.x;
      camera.position.z = next.z;
      camera.position.y = 1.7;
    }

    function onPointerDown(event) {
      if (overlayEl.classList.contains("is-open")) {
        return;
      }
      pointerId = event.pointerId;
      isDragging = true;
      dragMoved = false;
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    }

    function onPointerMove(event) {
      if (!isDragging || event.pointerId !== pointerId) {
        return;
      }
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      lastX = event.clientX;
      lastY = event.clientY;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
        dragMoved = true;
      }
      yaw -= dx * 0.003;
      pitch = clampPitch(pitch - dy * 0.003);
    }

    function pointerToNdc(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function onPointerUp(event) {
      if (event.pointerId !== pointerId) {
        return;
      }
      canvas.releasePointerCapture(event.pointerId);
      isDragging = false;
      if (!dragMoved) {
        pointerToNdc(event);
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(photoMeshes, false);
        if (hits.length > 0) {
          openOverlay(hits[0].object.userData.photoData);
        }
      }
    }

    // ============================================================
    //  Raycasting / Overlay
    // ============================================================
    function openOverlay(data) {
      overlayImageEl.src = data.src;
      overlayImageEl.alt = data.title;
      overlayTitleEl.textContent = data.title || "";
      overlayDescriptionEl.textContent = data.description || "";
      overlayCameraEl.innerHTML = data.camera ? `<strong>Camera</strong> ${data.camera}` : "";
      overlayDateEl.innerHTML = data.date ? `<strong>Date</strong> ${data.date}` : "";
      overlayLocationEl.innerHTML = data.location ? `<strong>Location</strong> ${data.location}` : "";
      overlayCameraEl.style.display = data.camera ? "block" : "none";
      overlayDateEl.style.display = data.date ? "block" : "none";
      overlayLocationEl.style.display = data.location ? "block" : "none";
      overlayEl.classList.add("is-open");
      overlayEl.setAttribute("aria-hidden", "false");
    }

    function closeOverlay() {
      overlayEl.classList.remove("is-open");
      overlayEl.setAttribute("aria-hidden", "true");
    }

    // ============================================================
    //  Animation Loop
    // ============================================================
    function animate() {
      requestAnimationFrame(animate);
      clock.getDelta();
      updateMovement();
      applyCameraRotation();
      statusEl.textContent = `X ${camera.position.x.toFixed(1)} / Z ${camera.position.z.toFixed(1)}`;
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    }

    function bindEvents() {
      window.addEventListener("resize", onResize);
      window.addEventListener("keydown", (event) => {
        keys[event.code] = true;
        if (event.code === "Escape") {
          closeOverlay();
        }
      });
      window.addEventListener("keyup", (event) => {
        keys[event.code] = false;
      });

      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("pointermove", onPointerMove);
      canvas.addEventListener("pointerup", onPointerUp);
      canvas.addEventListener("pointercancel", onPointerUp);

      overlayCloseEl.addEventListener("click", closeOverlay);
      overlayEl.addEventListener("click", (event) => {
        if (event.target.hasAttribute("data-close-overlay")) {
          closeOverlay();
        }
      });
    }

    async function init() {
      buildRoom();
      addLights();
      bindEvents();
      await buildArtworks();
      animate();
    }

    init().catch((error) => {
      console.error(error);
      statusEl.textContent = "Failed to initialize gallery";
    });
  </script>
</body>
</html>
